def cmakeDir = cmakeRoot.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> b.name <=> a.name }?.first()
if (!cmakeDir) {
    throw new GradleException("No CMake found under ${sdkDir}/cmake")
}
